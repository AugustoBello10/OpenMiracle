<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="3; url=https://openmiracle.com.br">
  <title>Miracle Wiki Tools - Novo Endereço Oficial</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dc4nkbnkg/image/upload/v1784748006/logowiki.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0c0c;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(197, 160, 89, 0.08) 0%, transparent 50%);
    }
    .card {
      background: linear-gradient(to bottom, rgba(20, 20, 20, 0.95), rgba(10, 10, 10, 0.98));
      border: 1px solid rgba(197, 160, 89, 0.35);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(197, 160, 89, 0.12);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 16px rgba(197, 160, 89, 0.45));
      object-contain: contain;
    }
    h1 {
      color: #c5a059;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }
    p {
      color: #a8a29e;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .url-badge {
      display: inline-block;
      background: rgba(197, 160, 89, 0.12);
      border: 1px solid rgba(197, 160, 89, 0.4);
      color: #f5d07a;
      padding: 10px 22px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 26px;
      letter-spacing: 0.8px;
    }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(to right, #c5a059, #b58934);
      color: #0c0c0c;
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 15px 20px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.35);
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(197, 160, 89, 0.55);
      background: linear-gradient(to right, #d4af37, #c5a059);
    }
    .countdown {
      margin-top: 20px;
      font-size: 12px;
      color: #78716c;
      font-family: monospace;
    }
    .countdown span {
      color: #c5a059;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://res.cloudinary.com/dc4nkbnkg/image/upload/v1784748006/logowiki.png" alt="Open Miracle Logo" class="logo">
    <h1>Miracle Wiki Tools</h1>
    <p>O site oficial está de casa nova! Migramos para um servidor dedicado de alta performance sob nosso novo domínio oficial.</p>
    <div class="url-badge">openmiracle.com.br</div>
    <a href="https://openmiracle.com.br" class="btn">Acessar Novo Endereço Agora</a>
    <div class="countdown">Redirecionando automaticamente em <span id="timer">3</span> segundos...</div>
  </div>

  <script>
    let sec = 3;
    const el = document.getElementById('timer');
    const interval = setInterval(() => {
      sec--;
      if (el) el.textContent = sec;
      if (sec <= 0) {
        clearInterval(interval);
        window.location.href = 'https://openmiracle.com.br' + window.location.pathname + window.location.search;
      }
    }, 1000);
  </script>
</body>
</html>
