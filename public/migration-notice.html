<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miracle Wiki Tools - Novo Endereço</title>
  <!-- Substitua pelo link do seu novo site (ex: Cloudflare Pages) -->
  <meta http-equiv="refresh" content="5;url=https://SEU_NOVO_ENDERECO.pages.dev">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #1c1813 0%, #0c0b0a 100%);
      color: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #141312;
      border: 2px solid #c5a059;
      border-radius: 18px;
      padding: 36px 28px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(197, 160, 89, 0.15);
    }
    .badge {
      display: inline-block;
      background: rgba(197, 160, 89, 0.15);
      border: 1px solid rgba(197, 160, 89, 0.4);
      color: #e6ca85;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      color: #fff;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    p {
      color: #a8a29e;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #c5a059 0%, #a07d3b 100%);
      color: #000;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
    }
    .btn:hover {
      background: linear-gradient(135deg, #d6b36e 0%, #b08d4b 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.45);
    }
    .countdown {
      margin-top: 20px;
      font-size: 12px;
      color: #78716c;
      font-family: monospace;
    }
    .countdown span {
      color: #c5a059;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Aviso de Migração</div>
    <h1>Mudamos para um Novo Endereço!</h1>
    <p>
      Para garantir maior velocidade e estabilidade ilimitada para todos os jogadores, a <strong>Miracle Wiki Tools</strong> foi transferida para um novo servidor oficial.
    </p>

    <!-- Atualize o link href abaixo para o seu novo endereço -->
    <a href="https://SEU_NOVO_ENDERECO.pages.dev" class="btn" id="redirectBtn">
      Acessar Novo Site Agora
    </a>

    <div class="countdown">
      Redirecionando automaticamente em <span id="timer">5</span> segundos...
    </div>
  </div>

  <script>
    // Substitua pelo seu novo link aqui também:
    const NEW_URL = "https://SEU_NOVO_ENDERECO.pages.dev";
    
    let seconds = 5;
    const timerElem = document.getElementById('timer');
    const btnElem = document.getElementById('redirectBtn');
    
    if (NEW_URL !== "https://SEU_NOVO_ENDERECO.pages.dev") {
      btnElem.href = NEW_URL;
      const interval = setInterval(() => {
        seconds--;
        if (timerElem) timerElem.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = NEW_URL;
        }
      }, 1000);
    } else {
      if (timerElem) timerElem.textContent = "—";
    }
  </script>
</body>
</html>
